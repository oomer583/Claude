name: Bootstrap Vercel Chatbot foundation

on:
  push:
    branches:
      - codex/oss-integration-foundation

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product repository
        uses: actions/checkout@v4
        with:
          ref: codex/oss-integration-foundation
          fetch-depth: 0

      - name: Stop if already bootstrapped
        id: guard
        run: |
          if [ -f .upstream-vercel-chatbot ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import upstream Vercel Chatbot
        if: steps.guard.outputs.done != 'true'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/vercel/chatbot.git "$tmp/chatbot"

          # Keep our product documentation and GitHub bootstrap workflow while
          # importing the upstream application as the product shell.
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'docs/' \
            --exclude 'AGENTS.md' \
            "$tmp/chatbot/" ./

          printf '%s\n' \
            'upstream=https://github.com/vercel/chatbot' \
            "commit=$(git -C "$tmp/chatbot" rev-parse HEAD)" \
            "imported_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > .upstream-vercel-chatbot

      - name: Commit imported application
        if: steps.guard.outputs.done != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Vercel Chatbot application foundation"
          git push origin HEAD:codex/oss-integration-foundation
